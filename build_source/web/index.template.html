<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HX家族多功能工具箱 · v6.1</title>
  <style>
{{CSS}}
  </style>
</head>

<body class="theme-light">
  <!-- 数据来自演示模式时必须显眼：否则用户会以为解锁真的成功了 -->
  <div class="mock-badge" id="mockBadge">演示数据 · 未连接宿主</div>

  <!-- GLOBAL SVG GRADIENT DEFS -->
  <svg viewBox="0 0 24 24" width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="hxCyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:var(--accent)" />
        <stop offset="100%" style="stop-color:var(--accent-secondary)" />
      </linearGradient>
      <linearGradient id="hxFireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:var(--danger)" />
        <stop offset="50%" style="stop-color:var(--fire-mid)" />
        <stop offset="100%" style="stop-color:var(--warning)" />
      </linearGradient>
      <linearGradient id="hxEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:var(--success)" />
        <stop offset="100%" style="stop-color:var(--emerald-deep)" />
      </linearGradient>
      <linearGradient id="hxVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#a78bfa" />
        <stop offset="55%" style="stop-color:var(--accent-secondary)" />
        <stop offset="100%" style="stop-color:#4f46e5" />
      </linearGradient>
      <linearGradient id="hxAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:var(--warning)" />
        <stop offset="60%" style="stop-color:#f59e0b" />
        <stop offset="100%" style="stop-color:var(--fire-mid)" />
      </linearGradient>
      <radialGradient id="hxFanBladeGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" style="stop-color:var(--gpu-blade-inner);stop-opacity:0.95" />
        <stop offset="58%" style="stop-color:var(--gpu-blade-mid);stop-opacity:0.88" />
        <stop offset="100%" style="stop-color:var(--gpu-blade-outer);stop-opacity:0.95" />
      </radialGradient>
      <!-- 9-Blade Precision Axial Fan Rotor Symbol -->
      <g id="hxTripleFanRotor">
        <circle cx="50" cy="50" r="46.5" fill="none" stroke="var(--gpu-fan-ring)" stroke-width="1.2" stroke-dasharray="4 3"/>
        <circle cx="50" cy="50" r="44" fill="none" stroke="var(--gpu-fan-ring-inner)" stroke-width="1"/>
        <g fill="url(#hxFanBladeGrad)" stroke="var(--gpu-blade-stroke)" stroke-width="0.9">
          <path d="M50 32 C54 18, 65 9, 75 13 C70 23, 62 33, 55 40 Z"/>
          <path d="M50 32 C54 18, 65 9, 75 13 C70 23, 62 33, 55 40 Z" transform="rotate(40 50 50)"/>
          <path d="M50 32 C54 18, 65 9, 75 13 C70 23, 62 33, 55 40 Z" transform="rotate(80 50 50)"/>
          <path d="M50 32 C54 18, 65 9, 75 13 C70 23, 62 33, 55 40 Z" transform="rotate(120 50 50)"/>
          <path d="M50 32 C54 18, 65 9, 75 13 C70 23, 62 33, 55 40 Z" transform="rotate(160 50 50)"/>
          <path d="M50 32 C54 18, 65 9, 75 13 C70 23, 62 33, 55 40 Z" transform="rotate(200 50 50)"/>
          <path d="M50 32 C54 18, 65 9, 75 13 C70 23, 62 33, 55 40 Z" transform="rotate(240 50 50)"/>
          <path d="M50 32 C54 18, 65 9, 75 13 C70 23, 62 33, 55 40 Z" transform="rotate(280 50 50)"/>
          <path d="M50 32 C54 18, 65 9, 75 13 C70 23, 62 33, 55 40 Z" transform="rotate(320 50 50)"/>
        </g>
      </g>
    </defs>
  </svg>

  <!-- AMBIENT CYBER PARTICLE FIELD CANVAS -->
  <canvas id="ambientParticleCanvas"></canvas>

  <main class="viewport">
    <div class="app-frame" id="appFrame">

      <!-- 44PX NATIVE DESKTOP TITLEBAR (ONLY LOGO + PRODUCT NAME + VERSION + 3 WINDOW BUTTONS) -->
      <header class="titlebar" id="appTitlebar">
        <div class="titlebar-left">
          <div class="app-logo-badge">
            <div class="logo-diamond">HX</div>
            <span class="titlebar-text">HX家族多功能工具箱</span>
            <span class="titlebar-ver" id="titlebarVersionBadge">v--</span>
          </div>
        </div>

        <div class="titlebar-right">
          <div class="window-dots">
            <button class="win-ctrl-btn min" title="最小化" data-action="window.min">
              <svg class="ctrl-glyph" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="6"/><path d="M7 12h10"/></svg>
            </button>
            <button class="win-ctrl-btn max" title="最大化 / 还原" data-action="window.max">
              <svg class="ctrl-glyph" viewBox="0 0 24 24"><rect class="svg-tone" x="7" y="7" width="10" height="10" rx="1.5"/><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            </button>
            <button class="win-ctrl-btn close" title="关闭窗口" data-action="window.close">
              <svg class="ctrl-glyph" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="6"/><path d="M8 8l8 8M16 8l-8 8"/></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- GLOBAL BUSY / PROGRESS BANNER -->
      <div class="global-busy-bar" id="globalBusyBar">
        <span class="pulse-dot"></span>
        <span id="globalBusyText">正在执行任务...</span>
      </div>

      <!-- APP BODY: 10-PAGE SIDEBAR + CONTENT VIEWPORT -->
      <div class="app-body">

        <nav class="sidebar" aria-label="主功能导航">
          <div>
            <div class="nav-group-label">功能导航</div>
            <ul class="nav-list" id="sidebarNavList">
              <li>
                <button class="nav-item active" data-action="nav.switch" data-page="device">
                  <svg class="nav-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="3" y="4" width="18" height="12" rx="2"/><rect x="3" y="4" width="18" height="12" rx="2"/><circle class="svg-dot" cx="8.5" cy="10" r="2"/><circle class="svg-dot" cx="15.5" cy="10" r="2"/><path d="M7 20h10M12 16v4"/></svg>
                  <span>硬件总览</span>
                </button>
              </li>
              <li>
                <button class="nav-item" data-action="nav.switch" data-page="unlock">
                  <svg class="nav-icon" viewBox="0 0 24 24"><path class="svg-tone" d="M12 3L4 6.5v5.5c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5V6.5L12 3z"/><path d="M12 3L4 6.5v5.5c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5V6.5L12 3z"/><circle class="svg-dot" cx="12" cy="11" r="2"/><path class="svg-line" d="M12 13v3"/></svg>
                  <span>固件解锁</span>
                </button>
              </li>
              <li>
                <button class="nav-item" data-action="nav.switch" data-page="spoof">
                  <svg class="nav-icon" data-tone="violet" viewBox="0 0 24 24"><polygon class="svg-tone" points="12 3 2 8 12 13 22 8 12 3"/><polygon points="12 3 2 8 12 13 22 8 12 3"/><path d="M2 13.5l10 5 10-5M2 18l10 5 10-5"/></svg>
                  <span>显卡伪装</span>
                </button>
              </li>
              <li>
                <button class="nav-item" data-action="nav.switch" data-page="power">
                  <svg class="nav-icon" data-tone="fire" viewBox="0 0 24 24"><polygon class="svg-dot" points="13 2 4.5 13.5 11.5 13.5 10.5 22 19.5 10.5 12.5 10.5 13 2"/><polygon points="13 2 4.5 13.5 11.5 13.5 10.5 22 19.5 10.5 12.5 10.5 13 2"/></svg>
                  <span>动态节能</span>
                </button>
              </li>
              <li>
                <button class="nav-item nav-sealed" data-action="nav.switch" data-page="dlss" title="DLSS 5 / 帧生成">
                  <svg class="nav-icon" data-tone="violet" viewBox="0 0 24 24"><rect class="svg-tone" x="2" y="6" width="20" height="12" rx="5"/><rect x="2" y="6" width="20" height="12" rx="5"/><path class="svg-line" d="M7 12h4M9 10v4"/><circle class="svg-dot" cx="16.5" cy="12" r="1.6"/></svg>
                  <span>DLSS 5 / 帧生成</span>
                  <!-- 内测标记：只做提示，不阻断进入（之前封条把整页挡死，连自测都进不去） -->
                  <span class="seal-ribbon" aria-hidden="true">
                    <svg class="seal-line" viewBox="0 0 100 100" preserveAspectRatio="none">
                      <line x1="0" y1="100" x2="100" y2="0" stroke="currentColor" stroke-width="56" />
                    </svg>
                    <b>内测</b>
                  </span>
                </button>
              </li>
              <li>
                <button class="nav-item" data-action="nav.switch" data-page="overlay">
                  <svg class="nav-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="11" y="6" width="8" height="6" rx="1"/><rect x="3" y="4" width="18" height="16" rx="2.5"/><rect class="svg-dot" x="11" y="6" width="8" height="6" rx="1"/></svg>
                  <span>游戏覆盖</span>
                </button>
              </li>
              <li>
                <button class="nav-item" data-action="nav.switch" data-page="dualgpu">
                  <svg class="nav-icon" data-tone="emerald" viewBox="0 0 24 24"><rect class="svg-tone" x="2.5" y="4" width="7" height="16" rx="2"/><rect x="2.5" y="4" width="7" height="16" rx="2"/><rect x="14.5" y="4" width="7" height="16" rx="2"/><path class="svg-line" d="M9.5 9h5M9.5 15h5"/></svg>
                  <span>双卡协同</span>
                </button>
              </li>
              <li>
                <button class="nav-item" data-action="nav.switch" data-page="maintenance">
                  <svg class="nav-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6L3.5 8.5V4"/><path d="M12 7.5V12l3 2"/><circle class="svg-dot" cx="12" cy="12" r="1.5"/></svg>
                  <span>系统维护</span>
                </button>
              </li>
              <li>
                <button class="nav-item" data-action="nav.switch" data-page="logs">
                  <svg class="nav-icon" data-tone="amber" viewBox="0 0 24 24"><rect class="svg-tone" x="3" y="4" width="18" height="16" rx="2.5"/><rect x="3" y="4" width="18" height="16" rx="2.5"/><path class="svg-line" d="M7.5 9.5l3 2.5-3 2.5"/><path d="M12.5 15h4"/></svg>
                  <span>审计日志</span>
                </button>
              </li>
              <li>
                <button class="nav-item" data-action="nav.switch" data-page="update">
                  <svg class="nav-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="4" y="14" width="16" height="6" rx="2"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path class="svg-line" d="M8 10l4 4 4-4M12 14V4"/></svg>
                  <span>软件更新</span>
                </button>
              </li>
            </ul>
          </div>

          <div class="sidebar-footer">
            <div class="hw-status-title">
              <span>当前显卡</span>
              <span class="hw-status-val" id="sidebarGpuModel">未加载</span>
            </div>
            <div class="bus-indicator">
              <span class="pulse-dot" id="sidebarBusDot" style="background: var(--text-muted);"></span>
              <span id="sidebarBusText">未知</span>
            </div>
          </div>
        </nav>

        <!-- MAIN CONTENT VIEWPORT -->
        <section class="content-area" id="mainContentArea">

          <!-- =================================================================
               PAGE 1: device (硬件总览)
               ================================================================= -->
                    <!-- {{PAGES}} 构建时按 pages/ 顺序注入 -->


        </section>
      </div>
    </div>
  </main>

  <!-- =======================================================================
       CUSTOM DANGER ACTION CONFIRMATION MODAL
       ======================================================================= -->
  <div class="modal-overlay" id="actionModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <svg class="svg-icon" viewBox="0 0 24 24"><path class="svg-tone" d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 10v4.5M12 17.5h.01"/></svg>
        <span id="modalTitle">操作确认</span>
      </div>
      <div class="modal-body">
        <div id="modalLeadText">请核对即将执行的变更：</div>
        <div class="modal-checklist">
          <div><strong>变更内容：</strong><span id="modalWhatChanges">--</span></div>
          <div><strong>影响范围：</strong><span id="modalWhatImpacts">--</span></div>
          <div><strong>如何撤销：</strong><span id="modalReversible">--</span></div>
          <div><strong>是否重启：</strong><span id="modalNeedReboot">--</span></div>
        </div>
        <div id="modalResetInputWrap" style="display:none;margin-top:8px;">
          <label style="font-size:12.5px;font-weight:800;color:var(--danger);display:block;margin-bottom:4px;" for="modalResetConfirmInput">
            安全锁：请输入大写 RESET 解锁确认按钮
          </label>
          <input type="text" class="text-input" id="modalResetConfirmInput" placeholder="在此输入 RESET" autocomplete="off" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-action="modal.close">取消</button>
        <button class="btn btn-danger" id="modalConfirmBtn" data-action="modal.execute">
          <span>确认执行</span>
        </button>
      </div>
    </div>
  </div>

  <!-- FLOATING TOAST STACK -->
  <div class="toast-stack" id="toastStack"></div>

  <script>
{{JS}}
  </script>
</body>
</html>
