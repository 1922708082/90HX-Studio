<!-- PAGE: power · 单独维护，构建时注入 index.html 的 #pageHost -->
<div id="view-power" class="view-panel">
            <div class="page-header">
              <div>
                <div class="page-title">
                  <svg class="svg-icon" viewBox="0 0 24 24"><polygon class="svg-tone" points="13 2 4.5 13.5 11.5 13.5 10.5 22 19.5 10.5 12.5 10.5 13 2"/><polygon points="13 2 4.5 13.5 11.5 13.5 10.5 22 19.5 10.5 12.5 10.5 13 2"/></svg>
                  <span>动态节能</span>
                </div>
                <div class="page-desc">空闲降频守护与功耗调节</div>
              </div>
              <div class="header-actions">
                <span class="tag" id="powerDaemonStatusTag">守护: 未知</span>
                <span class="tag" id="powerTaskStatusTag">任务: 未知</span>
              </div>
            </div>

            <div id="powerStateBanner"></div>

            <div class="card">
              <div class="card-title">
                <span title="power.enable / power.disable">守护进程</span>
                <span class="tag" id="powerLastTriggerTag">触发: 未知</span>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <label style="font-size:12.5px;font-weight:700;color:var(--text-sub);" for="powerIdleSecondsInput">空闲阈值(秒):</label>
                  <input type="number" class="text-input" id="powerIdleSecondsInput" min="1" max="300" value="8" style="width:88px;" />
                  <span style="font-size:11.5px;color:var(--text-sub);" id="powerRangeSummaryText">功耗范围: 未知</span>
                </div>
                <div style="display:flex;gap:8px;">
                  <button class="btn btn-primary" data-action="power.enable" id="btnPowerEnable">
                    <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><path d="M5.5 12.5l4.5 4.5L19 7.5"/></svg>
                    <span>开启守护</span>
                  </button>
                  <button class="btn btn-secondary" data-action="power.disable" id="btnPowerDisable">
                    <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="6" y="6" width="12" height="12" rx="2"/><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    <span>关闭守护</span>
                  </button>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title">
                <span title="power.setPreset">功耗策略</span>
                <span class="tag" id="powerCurrentPstateTag">状态: 未知</span>
              </div>
              <div class="power-preset-group">
                <button class="power-preset-card" id="presetCard-sleep" data-action="power.setPreset" data-preset="sleep" title="sleep">
                  <div class="power-icon-box">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path class="svg-tone" d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7z"/><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7z"/></svg>
                  </div>
                  <div class="power-name">极致静音</div>
                  <div class="power-desc">锁定低频待机，降低功耗与发热</div>
                </button>

                <button class="power-preset-card" id="presetCard-adaptive" data-action="power.setPreset" data-preset="adaptive" title="adaptive">
                  <div class="power-icon-box">
                    <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="3" y="5" width="18" height="14" rx="2.5"/><path d="M2.5 12h4l2.8-7.5 5.4 15 2.8-7.5h4"/></svg>
                  </div>
                  <div class="power-name">智能动态</div>
                  <div class="power-desc">空闲自动降频，负载瞬时唤醒</div>
                </button>

                <button class="power-preset-card" id="presetCard-turbo" data-action="power.setPreset" data-preset="turbo" title="turbo">
                  <div class="power-icon-box">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path class="svg-tone" d="M12 3c1.8 3.8 4.8 6.2 4.8 10.5a4.8 4.8 0 1 1-9.6 0C7.2 9.2 10.2 6.8 12 3z"/><path d="M12 3c1.8 3.8 4.8 6.2 4.8 10.5a4.8 4.8 0 1 1-9.6 0C7.2 9.2 10.2 6.8 12 3z"/></svg>
                  </div>
                  <div class="power-name">满血狂暴</div>
                  <div class="power-desc">释放完整功耗上限与核心频率</div>
                </button>
              </div>
            </div>

            <div class="animation-stage" id="powerAnimStage">
              <canvas id="turboFireCanvas"></canvas>
              <div class="anim-left">
                <div class="anim-status-badge" id="powerAnimBadge">
                  <span class="pulse-dot" id="powerAnimDot"></span>
                  <span id="powerAnimBadgeText">等待同步...</span>
                </div>
                <div class="anim-title" id="powerAnimTitle">当前策略: 未知</div>
                <div class="anim-sub" id="powerAnimSub">--</div>
                <div class="wave-strip-wrap">
                  <canvas id="powerWaveCanvas" width="480" height="64"></canvas>
                </div>
              </div>
              <div class="turbo-visual-box" id="powerAnimVisualBox">
                <div class="turbo-fire-ring"></div>
                <div class="turbo-fire-ring-2"></div>
                <div class="turbo-fire-ring-3"></div>
                <div class="turbo-data-readout">
                  <div class="turbo-mhz" id="powerReactorValText">-- W</div>
                  <div class="turbo-tag" id="powerReactorSubText">--</div>
                </div>
              </div>
            </div>
          </div>
