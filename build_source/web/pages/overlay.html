<!-- PAGE: overlay · 单独维护，构建时注入 index.html 的 #pageHost -->
<div id="view-overlay" class="view-panel">
            <div class="page-header">
              <div>
                <div class="page-title">
                  <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="11" y="6" width="8" height="6" rx="1"/><rect x="3" y="4" width="18" height="16" rx="2.5"/><rect x="11" y="6" width="8" height="6" rx="1"/></svg>
                  <span>游戏覆盖</span>
                </div>
                <div class="page-desc">解除 NVIDIA App 覆盖白名单</div>
              </div>
              <div class="header-actions">
                <button class="btn btn-secondary" data-action="overlay.cleanCache" id="btnOverlayCleanCache" title="overlay.cleanCache">
                  <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="6" y="6" width="12" height="14" rx="2"/><path d="M4 6h16M9 6V4h6v2M6 6v13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6"/></svg>
                  <span>清理缓存</span>
                </button>
                <button class="btn btn-secondary" data-action="modal.confirm" data-confirm-type="overlay.restore" id="btnOverlayRestore" title="overlay.restore">
                  <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6L3.5 8.5"/><path d="M3.5 3.5v5h5"/></svg>
                  <span>一键还原</span>
                </button>
                <button class="btn btn-primary" data-action="overlay.unlock" id="btnOverlayUnlock" title="overlay.unlock">
                  <svg class="svg-icon" viewBox="0 0 24 24"><polygon class="svg-tone" points="13 2 4.5 13.5 11.5 13.5 10.5 22 19.5 10.5 12.5 10.5 13 2"/><polygon points="13 2 4.5 13.5 11.5 13.5 10.5 22 19.5 10.5 12.5 10.5 13 2"/></svg>
                  <span>解除白名单</span>
                </button>
              </div>
            </div>

            <div id="overlayStateBanner"></div>

            <div class="card">
              <div class="card-title">
                <span>快捷键状态</span>
                <span class="tag" id="overlayInstallBadge">检测中...</span>
              </div>
              <div class="two-col-grid">
                <div style="background:var(--card-sub-bg);border:var(--card-border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div style="display:flex;align-items:center;gap:8px;">
                      <div class="matrix-icon-box" id="overlayAltZIconBox">
                        <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="11" y="6" width="8" height="6" rx="1"/><rect x="3" y="4" width="18" height="16" rx="2.5"/><rect x="11" y="6" width="8" height="6" rx="1"/></svg>
                      </div>
                      <div>
                        <div class="matrix-title" title="altZReady">Alt+Z 录屏面板</div>
                        <div class="matrix-sub" id="overlayAltZSubText">检测中...</div>
                      </div>
                    </div>
                    <span class="tag" id="overlayAltZPill">未知</span>
                  </div>
                  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);">
                    <div style="padding:8px;border-radius:12px;background:var(--card-bg);border:var(--card-border);text-align:center;">
                      <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v5h-5"/></svg>
                      <div style="font-size:11.5px;font-weight:700;color:var(--text-main);margin-top:4px;">即时重放</div>
                    </div>
                    <div style="padding:8px;border-radius:12px;background:var(--card-bg);border:var(--card-border);text-align:center;">
                      <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="2" y="6" width="14" height="12" rx="2"/><polygon points="22 8 16 12 22 16 22 8"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
                      <div style="font-size:11.5px;font-weight:700;color:var(--text-main);margin-top:4px;">视频录制</div>
                    </div>
                    <div style="padding:8px;border-radius:12px;background:var(--card-bg);border:var(--card-border);text-align:center;">
                      <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2"/></svg>
                      <div style="font-size:11.5px;font-weight:700;color:var(--text-main);margin-top:4px;">游戏滤镜</div>
                    </div>
                  </div>
                </div>

                <div style="background:var(--card-sub-bg);border:var(--card-border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div style="display:flex;align-items:center;gap:8px;">
                      <div class="matrix-icon-box" id="overlayAltRIconBox">
                        <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="3" y="5" width="18" height="14" rx="2.5"/><path d="M2.5 12h4l2.8-7.5 5.4 15 2.8-7.5h4"/></svg>
                      </div>
                      <div>
                        <div class="matrix-title" title="altRReady">Alt+R 性能浮层</div>
                        <div class="matrix-sub" id="overlayAltRSubText">检测中...</div>
                      </div>
                    </div>
                    <span class="tag" id="overlayAltRPill">未知</span>
                  </div>
                  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);">
                    <div style="padding:8px;border-radius:12px;background:var(--card-bg);border:var(--card-border);">
                      <div style="font-size:11.5px;color:var(--text-sub);">帧率监控</div>
                      <div style="font-size:12.5px;font-weight:800;color:var(--success);margin-top:4px;">实时帧率</div>
                    </div>
                    <div style="padding:8px;border-radius:12px;background:var(--card-bg);border:var(--card-border);">
                      <div style="font-size:11.5px;color:var(--text-sub);">延迟监控</div>
                      <div style="font-size:12.5px;font-weight:800;color:var(--accent);margin-top:4px;">渲染延迟</div>
                    </div>
                    <div style="padding:8px;border-radius:12px;background:var(--card-bg);border:var(--card-border);">
                      <div style="font-size:11.5px;color:var(--text-sub);">缓存占用</div>
                      <div style="font-size:12.5px;font-weight:800;color:var(--warning);margin-top:4px;" id="overlayCefHudText">--</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title">
                <span>解锁链路</span>
                <span class="tag" id="overlayBackupTag">备份: 未知</span>
              </div>
              <div style="margin-bottom:12px;padding:8px 12px;border-radius:12px;background:var(--card-sub-bg);border:var(--card-border);font-size:11.5px;color:var(--text-sub);font-family:ui-monospace,monospace;display:flex;align-items:center;gap:8px;">
                <svg class="svg-icon" viewBox="0 0 24 24"><path class="svg-tone" d="M3 7.5v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"/><path d="M3 7.5v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"/></svg>
                <span id="overlayPathText">路径: 未知</span>
              </div>
              <div class="boot-chain-stage">
                <div class="chain-node">
                  <div class="node-icon" id="overlayNodeInstall">
                    <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="2.5" y="4" width="19" height="13" rx="2"/><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 17v3.5"/></svg>
                  </div>
                  <div class="node-title">NVIDIA App</div>
                  <div class="node-status" id="overlayNodeInstallSub">未知</div>
                </div>

                <div class="chain-link-arrow" id="overlayArrow1"></div>

                <div class="chain-node">
                  <div class="node-icon" id="overlayNodePatch">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path class="svg-tone" d="M12 3L4 6.5v5.5c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5V6.5L12 3z"/><path d="M12 3L4 6.5v5.5c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5V6.5L12 3z"/><circle cx="12" cy="11" r="2"/><path d="M12 13v3"/></svg>
                  </div>
                  <div class="node-title">白名单校验</div>
                  <div class="node-status" id="overlayNodePatchSub">未知</div>
                </div>

                <div class="chain-link-arrow" id="overlayArrow2"></div>

                <div class="chain-node">
                  <div class="node-icon" id="overlayNodeHud">
                    <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="11" y="6" width="8" height="6" rx="1"/><rect x="3" y="4" width="18" height="16" rx="2.5"/><rect x="11" y="6" width="8" height="6" rx="1"/></svg>
                  </div>
                  <div class="node-title">游戏内覆盖</div>
                  <div class="node-status" id="overlayNodeHudSub">未知</div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title">
                <span title="overlay.state">环境检查</span>
              </div>
              <div class="matrix-grid" id="overlayMatrixGrid">
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
              </div>
            </div>
          </div>
