<!-- PAGE: logs · 单独维护，构建时注入 index.html 的 #pageHost -->
<div id="view-logs" class="view-panel">
            <div class="page-header">
              <div>
                <div class="page-title">
                  <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="3" y="4" width="18" height="16" rx="2.5"/><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7.5 9.5l3 2.5-3 2.5M12.5 15h4"/></svg>
                  <span>审计日志</span>
                </div>
                <div class="page-desc">硬件操作与系统事件记录</div>
              </div>
              <div class="header-actions">
                <button class="btn btn-secondary" data-action="logs.copy" id="btnLogsCopy">
                  <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="9" y="9" width="11" height="11" rx="2"/><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>
                  <span>复制日志</span>
                </button>
                <button class="btn btn-secondary" data-action="logs.export" id="btnLogsExport">
                  <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="4" y="14" width="16" height="6" rx="2"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M8 10l4 4 4-4M12 14V4"/></svg>
                  <span>导出日志</span>
                </button>
                <button class="btn btn-secondary" data-action="logs.clear" id="btnLogsClear">
                  <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="6" y="6" width="12" height="14" rx="2"/><path d="M4 6h16M9 6V4h6v2M6 6v13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6"/></svg>
                  <span>清空日志</span>
                </button>
              </div>
            </div>

            <div id="logsStateBanner"></div>

            <div class="telemetry-grid">
              <div class="card" style="cursor:pointer;" data-action="logs.filterLevel" data-level="all">
                <div style="display:flex;align-items:center;gap:12px;">
                  <div class="matrix-icon-box">
                    <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="3" y="4" width="18" height="16" rx="2.5"/><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7.5 9.5l3 2.5-3 2.5M12.5 15h4"/></svg>
                  </div>
                  <div>
                    <div style="font-size:11.5px;color:var(--text-sub);font-weight:700;">全部记录</div>
                    <div style="font-size:24px;font-weight:900;color:var(--text-main);font-family:ui-monospace,monospace;" id="logsStatAll">0</div>
                  </div>
                </div>
              </div>

              <div class="card" style="cursor:pointer;" data-action="logs.filterLevel" data-level="audit">
                <div style="display:flex;align-items:center;gap:12px;">
                  <div class="matrix-icon-box pass">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path class="svg-tone" d="M12 3L4 6.5v5.5c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5V6.5L12 3z"/><path d="M12 3L4 6.5v5.5c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5V6.5L12 3z"/><circle cx="12" cy="11" r="2"/><path d="M12 13v3"/></svg>
                  </div>
                  <div>
                    <div style="font-size:11.5px;color:var(--text-sub);font-weight:700;">安全审计</div>
                    <div style="font-size:24px;font-weight:900;color:var(--success);font-family:ui-monospace,monospace;" id="logsStatAudit">0</div>
                  </div>
                </div>
              </div>

              <div class="card" style="cursor:pointer;" data-action="logs.filterLevel" data-level="warn">
                <div style="display:flex;align-items:center;gap:12px;">
                  <div class="matrix-icon-box warn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path class="svg-tone" d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 10v4.5M12 17.5h.01"/></svg>
                  </div>
                  <div>
                    <div style="font-size:11.5px;color:var(--text-sub);font-weight:700;">警告事件</div>
                    <div style="font-size:24px;font-weight:900;color:var(--warning);font-family:ui-monospace,monospace;" id="logsStatWarn">0</div>
                  </div>
                </div>
              </div>

              <div class="card" style="cursor:pointer;" data-action="logs.filterLevel" data-level="error">
                <div style="display:flex;align-items:center;gap:12px;">
                  <div class="matrix-icon-box danger">
                    <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5l-5 5M9.5 9.5l5 5"/></svg>
                  </div>
                  <div>
                    <div style="font-size:11.5px;color:var(--text-sub);font-weight:700;">错误异常</div>
                    <div style="font-size:24px;font-weight:900;color:var(--danger);font-family:ui-monospace,monospace;" id="logsStatError">0</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-title">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;" id="logsFilterBar">
                  <span>日志筛选</span>
                  <button class="seg-btn active" data-action="logs.filterLevel" data-level="all" style="padding:4px 8px;font-size:11.5px;">全部</button>
                  <button class="seg-btn" data-action="logs.filterLevel" data-level="info" title="INFO" style="padding:4px 8px;font-size:11.5px;">常规</button>
                  <button class="seg-btn" data-action="logs.filterLevel" data-level="warn" title="WARN" style="padding:4px 8px;font-size:11.5px;">警告</button>
                  <button class="seg-btn" data-action="logs.filterLevel" data-level="error" title="ERROR" style="padding:4px 8px;font-size:11.5px;">错误</button>
                  <button class="seg-btn" data-action="logs.filterLevel" data-level="audit" title="AUDIT" style="padding:4px 8px;font-size:11.5px;">审计</button>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <input type="text" class="text-input" id="logsSearchInput" placeholder="搜索日志" style="width:184px;padding:4px 8px;font-size:12.5px;" />
                  <button class="btn btn-secondary" data-action="logs.loadMore" style="padding:4px 8px;font-size:11.5px;">
                    <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><path d="M12 5.5v13M6.5 11l5.5-5.5 5.5 5.5"/></svg>
                    <span>更早记录</span>
                  </button>
                </div>
              </div>

              <div class="log-stream-box" id="logStreamBox"></div>

              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--text-sub);">
                <span id="logsCountText">共 0 条</span>
                <button class="tool-chip-btn" id="btnLogsResumeScroll" data-action="logs.scrollToBottom" style="display:none;">
                  <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><path d="M12 5.5v13M6.5 13l5.5 5.5 5.5-5.5"/></svg>
                  <span>回到最新</span>
                </button>
              </div>
            </div>
          </div>
