<!-- PAGE: update · 单独维护，构建时注入 index.html 的 #pageHost -->
<div id="view-update" class="view-panel">
            <div class="page-header">
              <div>
                <div class="page-title">
                  <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="4" y="14" width="16" height="6" rx="2"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M8 10l4 4 4-4M12 14V4"/></svg>
                  <span>软件更新</span>
                </div>
                <div class="page-desc">版本检查与安全校验更新</div>
              </div>
              <div class="header-actions">
                <button class="btn btn-secondary" data-action="update.check" id="btnUpdateCheck">
                  <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5v5h-5"/></svg>
                  <span>检查更新</span>
                </button>
                <button class="btn btn-secondary" data-action="update.download" id="btnUpdateDownload">
                  <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="4" y="14" width="16" height="6" rx="2"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M8 10l4 4 4-4M12 14V4"/></svg>
                  <span>下载更新</span>
                </button>
                <button class="btn btn-primary" data-action="update.apply" id="btnUpdateApply" disabled>
                  <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><path d="M5.5 12.5l4.5 4.5L19 7.5"/></svg>
                  <span>应用更新</span>
                </button>
              </div>
            </div>

            <div id="updateStateBanner"></div>

            <!-- 全局下载源：没代理时换镜像前缀，DLSS 与更新共用 -->
            <div class="card" style="margin-bottom:14px;">
              <div class="card-title" style="margin-bottom:10px;">下载源设置</div>
              <div class="form-row" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                <label style="font-size:12.5px;color:var(--text-sub);width:96px;">加速前缀</label>
                <input class="text-input" id="cfgDownloadProxy" placeholder="https://ghfast.top/" style="flex:1;min-width:220px;" />
                <label style="font-size:12.5px;color:var(--text-sub);width:96px;">更新清单地址</label>
                <input class="text-input" id="cfgUpdateUrl" placeholder="https://muyaa.top/hx/latest.json" style="flex:1;min-width:220px;" />
                <label style="font-size:12.5px;color:var(--text-sub);width:96px;">代理</label>
                <select class="select-input" id="cfgProxyMode" style="width:150px;">
                  <option value="system">跟随系统</option>
                  <option value="manual">手动指定</option>
                  <option value="direct">不使用代理</option>
                </select>
                <input class="text-input" id="cfgProxyAddress" placeholder="http://127.0.0.1:7890" style="flex:1;min-width:180px;" />
                <button class="btn btn-secondary" data-action="settings.save" id="btnSaveDownloadCfg">
                  <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="5" y="4" width="14" height="16" rx="2"/><path d="M8 4v5h8V4M8 15h8"/></svg>
                  <span>保存</span>
                </button>
              </div>
              <div class="page-desc" style="margin-top:8px;">留空时自动依次尝试内置加速源（ghproxy.net / ghfast.top / gh-proxy.com / gitmirror），最后直连；填了则优先用你的。每次尝试都会写进日志。</div>
            </div>


            <div class="card">
              <div class="card-title">
                <span>校验流程</span>
                <span class="tag" id="updateHasUpdateBadge">未知</span>
              </div>
              <div class="boot-chain-stage">
                <div class="chain-node">
                  <div class="node-icon active">
                    <svg class="svg-icon" viewBox="0 0 24 24"><circle class="svg-tone" cx="12" cy="12" r="8.5"/><path d="M5.5 12.5l4.5 4.5L19 7.5"/></svg>
                  </div>
                  <div class="node-title">证书校验</div>
                  <div class="node-status">安全连接</div>
                </div>

                <div class="chain-link-arrow active"></div>

                <div class="chain-node">
                  <div class="node-icon" id="updateNodeDownload">
                    <svg class="svg-icon" viewBox="0 0 24 24"><rect class="svg-tone" x="4" y="14" width="16" height="6" rx="2"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M8 10l4 4 4-4M12 14V4"/></svg>
                  </div>
                  <div class="node-title" id="updateNodeAssetTitle">获取安装包</div>
                  <div class="node-status" id="updateNodeAssetSub">待下载</div>
                </div>

                <div class="chain-link-arrow" id="updateArrowVerify"></div>

                <div class="chain-node">
                  <div class="node-icon" id="updateNodeVerify">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path class="svg-tone" d="M12 3L4 6.5v5.5c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5V6.5L12 3z"/><path d="M12 3L4 6.5v5.5c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5V6.5L12 3z"/><circle cx="12" cy="11" r="2"/><path d="M12 13v3"/></svg>
                  </div>
                  <div class="node-title">哈希校验</div>
                  <div class="node-status" id="updateNodeVerifySub">待校验</div>
                </div>
              </div>
            </div>

            <div class="two-col-grid">
              <div class="card">
                <div class="card-title">
                  <span title="update.state">版本状态</span>
                </div>
                <table class="data-table kv-table">
                  <tbody>
                    <tr>
                      <td title="currentVersion">当前版本</td>
                      <td id="updateCurrentVerText">--</td>
                    </tr>
                    <tr>
                      <td title="latestVersion">最新版本</td>
                      <td id="updateLatestVerText" style="color:var(--accent);font-weight:800;">--</td>
                    </tr>
                    <tr>
                      <td title="assetName">安装包</td>
                      <td id="updateAssetNameText">--</td>
                    </tr>
                    <tr>
                      <td title="sha256">哈希值</td>
                      <td id="updateSha256Text" style="word-break:break-all;">--</td>
                    </tr>
                    <tr>
                      <td title="verified">校验状态</td>
                      <td id="updateVerifiedText">--</td>
                    </tr>
                  </tbody>
                </table>

                <div class="progress-wrap" id="updateProgressWrap">
                  <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-sub);font-family:ui-monospace,monospace;">
                    <span id="updateProgressStage">准备下载...</span>
                    <span id="updateProgressPercent">0%</span>
                  </div>
                  <div class="progress-track">
                    <div class="progress-fill" id="updateProgressFill" style="width:0%;"></div>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-title">
                  <span title="releaseNotes">更新说明</span>
                </div>
                <pre id="updateReleaseNotesBox" style="white-space:pre-wrap;font-family:inherit;font-size:12.5px;color:var(--text-sub);line-height:1.65;background:var(--card-sub-bg);padding:12px;border-radius:12px;border:var(--card-border);min-height:160px;">暂无说明</pre>
              </div>
            </div>
          </div>
